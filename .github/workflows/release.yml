# Creates a GitHub release for each pushed version tag (v1.0.0, v1.2.3...),
# with release notes generated by git-cliff from the commits since the
# previous tag (see cliff.toml and docs/development.md).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to the commit of their release, so that a moved tag
      # cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # git-cliff needs the full history and the tags

      - name: Release notes
        id: cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header   # only this tag's changes, no title
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.cliff.outputs.changelog }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$NOTES"
