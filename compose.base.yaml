# Shared by every instance: each instances/<name>/compose.yaml extends the dss
# service below with its own DSS base image, JDBC drivers and port. See
# README.md. Relative paths here are relative to this file's folder.
services:
  dss:
    # Only image/ is sent to Docker to build the image: the Dockerfile and the
    # scripts it copies. The license and the instances never reach the build.
    build:
      context: ./image
    # Build on every "docker compose up", from cache, so that the image always
    # matches the instance's compose.yaml, even after it changes. Compose names
    # the image after the instance: <name>-dss.
    pull_policy: build
    # Host port from DSS_HOST_PORT (default 10000), bound to 127.0.0.1 only.
    # Compose reads it from the shell or the instance's .env file; it is not
    # passed into the container. Inside, DSS always listens on 10000, the
    # image's DSS_PORT, which its installer and the healthcheck rely on.
    ports:
      - "127.0.0.1:${DSS_HOST_PORT:-10000}:10000"
    volumes:
      - dss-data:/home/dataiku/dss
      # One license for every instance, read-only. The folder is mounted rather
      # than the file, so that the license can be missing.
      - ./license:/home/dataiku/license:ro
    restart: on-failure:3
    init: true
    security_opt:
      - no-new-privileges:true

# Instances declare this volume again: extends does not carry it over.
volumes:
  dss-data:
